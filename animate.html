<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery Left Right Animation</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- External JS -->
    <script src="script.js" defer></script>

    <style>
        body {
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        #circle {
            width: 150px;
            height: 150px;
            background-color: pink;
            border-radius: 50%;
            position: absolute;
            left: 0;
            opacity: 1;
        }

        #startBtn {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="startBtn">Start Animation</button>
    <div id="circle"></div>

</body>
</html>

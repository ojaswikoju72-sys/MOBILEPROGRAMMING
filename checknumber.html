<!DOCTYPE html>
<html>
<head>
  <title>Number Checker</title>
  <style>
    .result {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid black;
      width: 250px;
    }
  </style>
</head>
<body>

<h2>Number Checker</h2>

<!-- Input for number -->
Enter a number: <input type="number" id="numberInput"><br><br>

<!-- Button to check number -->
<button onclick="checkNumber()">Check Number</button>

<!-- Div to display result -->
<div id="resultDiv" class="result">Result will appear here</div>

<!-- Link to external JavaScript -->
<script src="script.js"></script>

</body>
</html>
